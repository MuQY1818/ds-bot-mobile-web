name: source-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- mobile-web-prototype/plugin/client.js
      - run: npm run audit:files
